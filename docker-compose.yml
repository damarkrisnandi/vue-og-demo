# Local sidecar simulation of the nginx + og-meta-service split described in chat.
# Run `npm run build` first so ./dist exists, then `docker compose up`.
# Replace the "nginx" image below with your hardened internal image in real deployments.
services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8081:8080"
    volumes:
      - ./dist:/etc/nginx/html/webportal:ro
      - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - og-meta-service

  og-meta-service:
    build: .
    environment:
      PORT: 8080
